name: Reusable Playwright

on:
  workflow_call:
    inputs:
        command:
          required: true
          type: string
        suite:
          required: true
          type: string
        runner:
          type: string
        image-tag:
          type: string
    secrets:
        SLACK_WEBHOOK_URL:
          required: true
        DOCKERHUB_USERNAME:
          required: true
        DOCKERHUB_TOKEN:
          required: true
        ENV_FILE_BASE64:
          required: true
          
permissions:
  contents: write

jobs:
  execute-playwright:
    name: Executing
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Pull Image
        run: docker pull 181221/playwright-framework:${{ inputs.image-tag }}

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE_BASE64 }}" | base64 -d > .env

      - name: Run Playwright Tests
        run: |
          docker run --rm \
            --env-file .env \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            181221/playwright-framework:${{ inputs.image-tag }} \
            yarn ${{ inputs.command }}

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.suite }}-report
          path: playwright-report
          retention-days: 7

      - name: Deploy to GitHub Pages                                                                                                                                
        if: always()                                                                                                                                                
        uses: peaceiris/actions-gh-pages@v4                                                                                                                         
        with:                                                                                                                                                       
          github_token: ${{ secrets.GITHUB_TOKEN }}                                                                                                                 
          publish_branch: gh-pages                                                                                                                                  
          publish_dir: playwright-report                                                                                                                            
          destination_dir: ${{ inputs.suite }}                                                                                             
          keep_files: true   

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: |
              ${{ job.status == 'success' && '✅' || '❌' }} Playwright test: ${{ job.status }}
              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Test suite: ${{ inputs.command }}
              Triggered by: ${{ github.actor }}
              Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}